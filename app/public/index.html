<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Noon Learn</title>
    <meta name="description" content="Learn Islam, anytime, anywhere: madrasa classes, Noon Courses, Quran & Hifz and learning games." />
    <!-- PWA: installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B5166" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Noon Learn" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background: #EAF2F4; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Noon Learn needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
      // Keep the browser's install prompt so the app can show its own "Install app" button.
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__noonInstallPrompt = e; window.dispatchEvent(new Event('noon-install-ready')); });
    </script>
  </body>
</html>
