# /etc/supervisor/conf.d/noon-queue.conf   →  supervisorctl reread && supervisorctl update
[program:noon-queue]
command=php /var/www/noon-learn/api/server/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/noon-learn/api/server/storage/logs/queue.log
stopwaitsecs=3600
