# /etc/nginx/sites-available/noon-api   (Hostinger VPS, Ubuntu 22.04/24.04)
# ln -s /etc/nginx/sites-available/noon-api /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Then: certbot --nginx -d api.yourdomain.com
server {
    listen 80;
    server_name api.yourdomain.com;
    root /var/www/noon-learn/api/public;
    index index.php;

    client_max_body_size 210M;   # course videos / PDFs upload

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files (chat, courses, study tools) are never run as code.
    location ~* ^/storage/.*\.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # Any other .php file is refused: only public/index.php runs.
    location ~ \.php$ { return 404; }

    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~ /\.(?!well-known) { deny all; }
}
